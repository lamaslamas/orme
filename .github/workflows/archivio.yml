# Ogni giorno GitHub legge le fonti (Ecotur, calendario Wolf Howling del Parco,
# itinerari MTB su OpenStreetMap) e aggiorna public/dati/archivio.json.
# Se l'archivio cambia: salva la modifica nel repository e ripubblica l'app.
# (Una modifica salvata da questo workflow non avvia "Pubblica su GitHub Pages",
# per questo la pubblicazione è fatta qui.)
name: Aggiorna l'archivio dei percorsi

on:
  schedule:
    - cron: '17 4 * * *' # ogni giorno alle 4:17 UTC
  workflow_dispatch: # e a mano, dal pulsante "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  importa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cambiato: ${{ steps.salva.outputs.cambiato }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Leggi le fonti
        run: node scripts/importa-archivio.mjs
      # luoghi delle uscite senza traccia (Nominatim, solo nel riquadro del parco), per i "Sentieri probabili"
      - name: Trova i luoghi delle uscite
        run: node scripts/luoghi-uscite.mjs
        continue-on-error: true
        timeout-minutes: 10
      # uscite collegate a un sentiero sul telefono ed esportate in public/dati/collegamenti.json
      - name: Applica i collegamenti delle uscite
        run: node scripts/applica-collegamenti.mjs
        continue-on-error: true
      # celle delle quote TINITALY già scaricate: restano tra una notte e l'altra (il terreno non cambia)
      - uses: actions/cache@v4
        with:
          path: .cache/tinitaly
          key: tinitaly-${{ github.run_id }}
          restore-keys: tinitaly-
      # indice panoramico: solo per i percorsi nuovi o con la traccia cambiata
      - name: Calcola l'indice panoramico
        run: node scripts/calcola-panorama.mjs
        continue-on-error: true
      # rifugi, bivacchi e acqua da OpenStreetMap: ogni parco al massimo una volta a settimana
      - name: Aggiorna rifugi e acqua
        run: node scripts/scarica-punti.mjs
        continue-on-error: true
        timeout-minutes: 15
      # rifugi e acqua di tutta Italia a quadrati: 20 per notte (prima i parchi del Sud e il PNALM, poi
      # dal più vecchio), pausa tra le richieste; cali sospetti e risposte incomplete non sovrascrivono
      - name: Rifugi e acqua di tutta Italia
        run: node scripts/scarica-punti-italia.mjs --max 20
        continue-on-error: true
        timeout-minutes: 40
      # l'archivio diviso per parco (un file per parco + indice): l'app scarica solo l'indice e i parchi che usa
      - name: Dividi l'archivio per parco
        run: node scripts/dividi-archivio.mjs
      - name: Salva l'archivio se è cambiato
        id: salva
        run: |
          if git diff --quiet -- public/dati/archivio.json public/dati/fauna-parchi.json && [ -z "$(git status --porcelain public/dati)" ]; then
            echo "Archivio invariato."
            echo "cambiato=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dati
          git commit -m "Archivio: aggiornamento automatico dei percorsi"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "cambiato=true" >> "$GITHUB_OUTPUT"
      - if: steps.salva.outputs.cambiato == 'true'
        run: npm test
      - if: steps.salva.outputs.cambiato == 'true'
        run: npm run build
      - if: steps.salva.outputs.cambiato == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pubblica:
    needs: importa
    if: needs.importa.outputs.cambiato == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
